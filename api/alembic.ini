# Migrations do schema do DataRepo (tabelas de sistema).
#
#   alembic upgrade head        aplica o que falta (o deploy roda isto antes do app)
#   alembic current             versao aplicada no banco
#   alembic revision -m "..."   nova migration (escrita a mao; sem autogenerate)
#
# A URL do banco vem de DATABASE_URL (migrations/env.py), nunca deste arquivo.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
